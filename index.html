<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaze Mouse System - Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/webgazer@2.1.0/dist/webgazer.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #121212;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #calibration-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .calibration-dot {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: #ff4757;
            border-radius: 50%;
            display: none;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.8);
            border: 3px solid white;
        }

        .calibration-dot::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #2ed573;
            box-sizing: border-box;
            clip-path: inset(100% 0 0 0);
            transition: clip-path 2s linear;
        }

        .calibration-dot.filling::after {
            clip-path: inset(0 0 0 0);
        }

        #status-bar {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 500;
        }

        #dwell-indicator {
            position: fixed;
            width: 60px;
            height: 60px;
            border: 4px solid rgba(46, 213, 115, 0.5);
            border-radius: 50%;
            pointer-events: none;
            display: none;
            transform: translate(-50%, -50%);
            z-index: 999;
        }

        #dwell-progress {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #2ed573;
            box-sizing: border-box;
            clip-path: inset(100% 0 0 0);
        }

        #instructions {
            text-align: center;
            max-width: 600px;
        }

        button {
            background: #2ed573;
            border: none;
            padding: 15px 30px;
            color: white;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #26af5f;
        }
    </style>
</head>
<body>

    <div id="calibration-overlay">
        <div id="instructions">
            <h1>Gaze Mouse System</h1>
            <p>This system allows you to control your computer's mouse using only your eyes.</p>
            <p><strong>Calibration:</strong> A red dot will appear at 9 points. Please look directly at the dot and keep your head still until it turns green and moves.</p>
            <button id="start-btn">Start Calibration</button>
        </div>
    </div>

    <div id="calibration-dot" class="calibration-dot"></div>

    <div id="dwell-indicator">
        <div id="dwell-progress"></div>
    </div>

    <div id="status-bar">
        Status: <span id="status-text">Initializing...</span> | 
        Server: <span id="server-status">Disconnected</span>
    </div>

    <script src="app.js"></script>
</body>
</html>
